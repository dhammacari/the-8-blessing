<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พุทธชัยมงคล ๘ - The Buddha's 8 Victories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #fdfaf5; }
        .font-serif { font-family: 'Sarabun', serif; font-weight: 700; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const Icon = ({ name, className }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const victories = [
            { id: 1, opponent: "พญามาร", title: "ชนะความกลัว", pali: "พาหุง สะหัสสะมะภินิมมิตะสาวุธันตัง...", story: "พญามารยกทัพมาขัดขวางการตรัสรู้ แต่พระองค์ทรงใช้บารมีสยบจนพ่ายแพ้", lesson: "ความดีสยบความวุ่นวาย", icon: "shield", color: "from-red-100 to-orange-100", textColor: "text-red-700" },
            { id: 2, opponent: "อาฬวกยักษ์", title: "ชนะความโกรธ", pali: "มาราติเรกะมะภิยุชฌิตะสัพพะรัตติง...", story: "ยักษ์ดุร้ายขู่กรรโชกทั้งคืน แต่พระองค์ทรงใช้ความอดทนและเมตตาจนยอมจำนน", lesson: "ความอดทนคือตบะชั้นเลิศ", icon: "flame", color: "from-orange-100 to-yellow-100", textColor: "text-orange-700" },
            { id: 3, opponent: "ช้างนาฬาคิรี", title: "ชนะความบ้าคลั่ง", pali: "นาฬาคิริง คะชะวะรัง อะติมัตตะภูตัง...", story: "ช้างตกมันวิ่งเข้าทำร้าย แต่พระองค์ทรงแผ่เมตตาจนช้างยอมสยบแทบพระบาท", lesson: "เมตตาธรรมสยบความรุนแรง", icon: "heart", color: "from-yellow-100 to-amber-100", textColor: "text-amber-700" },
            { id: 4, opponent: "องคุลิมาล", title: "ชนะความโหดร้าย", pali: "อุกขิตตะขัคคะมะติหัตถะสุทารุณันตัง...", story: "จอมโจรไล่ฆ่าคน แต่พระองค์ทรงใช้ปัญญาเปลี่ยนใจโจรให้กลับตัวเป็นคนดี", lesson: "ไม่มีใครสายเกินไปที่จะเริ่มใหม่", icon: "hand", color: "from-slate-100 to-gray-200", textColor: "text-slate-700" },
            { id: 5, opponent: "นางจิญจมาณวิกา", title: "ชนะคำใส่ร้าย", pali: "กัตตะวานะ กัฏฐะมุทะรัง อิวะ คัพภินียา...", story: "หญิงถูกจ้างมาใส่ร้ายพระองค์ แต่พระองค์ทรงนิ่งสงบจนความจริงปรากฏ", lesson: "ความนิ่งสยบข่าวลือ", icon: "message-square", color: "from-pink-100 to-rose-100", textColor: "text-pink-700" },
            { id: 6, opponent: "สัจจกนิครนถ์", title: "ชนะทิฐิ", pali: "สัจจัง วิหายะ มะติสัจจะกะวาทะเกตุง...", story: "นักปราชญ์จอมปลอมท้าประลองปัญญา แต่ต้องยอมแพ้ต่อแสงแห่งธรรม", lesson: "ปัญญาที่แท้คือทางสว่าง", icon: "book-open", color: "from-blue-100 to-cyan-100", textColor: "text-blue-700" },
            { id: 7, opponent: "นันโทปนันทนาคราช", title: "ชนะอิทธิฤทธิ์", pali: "นันโทปะนันทะภุชะคัง วิพุธัง มะหิทธิง...", story: "พญานาคพยายามปิดกั้นทางธรรม แต่พระองค์ทรงปราบด้วยฤทธิ์ที่เหนือกว่า", lesson: "อำนาจต้องคู่ความถูกต้อง", icon: "zap", color: "from-indigo-100 to-purple-100", textColor: "text-indigo-700" },
            { id: 8, opponent: "พกาพรหม", title: "ชนะอวิชชา (ซ่อนแอบ)", pali: "ทุคคาหะทิฏฐิภุชะเคนะ สุทัฏฐะหัตถัง...", story: "พรหมท้าซ่อนแอบ พระองค์ซ่อนบนเศียรพรหมจนหาไม่เจอ เพราะความยึดติดบังตา", lesson: "ใจเราอยู่ใกล้ที่สุด แต่หาเจอยยากที่สุด", icon: "eye", color: "from-emerald-100 to-green-100", textColor: "text-emerald-700" }
        ];

        function App() {
            const [step, setStep] = useState(0);
            const goTo = (s) => { setStep(s); window.scrollTo(0,0); };

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="max-w-4xl w-full fade-in">
                        {step === 0 && (
                            <div className="text-center space-y-8 bg-white p-12 rounded-[3rem] shadow-xl border border-amber-100">
                                <h1 className="text-5xl font-black text-slate-900 font-serif">พุทธชัยมงคล <span className="text-amber-600">๘</span></h1>
                                <p className="text-xl text-slate-600 italic">"ชัยชนะแห่งพระพุทธองค์ สู่ปัญญาในใจคุณ"</p>
                                <div className="flex justify-center"><Icon name="sparkles" className="w-32 h-32 text-amber-400 animate-pulse" /></div>
                                <button onClick={() => goTo(1)} className="px-12 py-4 bg-slate-900 text-white rounded-full font-bold text-xl hover:bg-amber-600 transition-all">เริ่มต้นเรียนรู้</button>
                            </div>
                        )}
                        {step >= 1 && step <= 8 && (
                            <div className="bg-white rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col md:flex-row border border-slate-100">
                                <div className={`md:w-5/12 bg-gradient-to-br ${victories[step-1].color} flex flex-col items-center justify-center p-12 text-center`}>
                                    <Icon name={victories[step-1].icon} className={`w-32 h-32 ${victories[step-1].textColor} mb-6`} />
                                    <h2 className="text-3xl font-bold text-slate-900">{victories[step-1].opponent}</h2>
                                    <span className="mt-2 text-sm font-bold opacity-50 uppercase tracking-widest text-slate-600">Victory {step}</span>
                                </div>
                                <div className="md:w-7/12 p-10 md:p-16 flex flex-col justify-between space-y-6">
                                    <div className="space-y-6">
                                        <h3 className="text-3xl font-bold text-slate-900 font-serif">{victories[step-1].title}</h3>
                                        <div className="bg-amber-50 p-6 rounded-2xl border-l-8 border-amber-400 italic text-amber-900 text-lg">"{victories[step-1].pali}"</div>
                                        <p className="text-slate-600 leading-relaxed text-lg"><span className="font-bold text-slate-800">เรื่องราว:</span> {victories[step-1].story}</p>
                                        <p className="text-amber-800 font-bold text-lg bg-amber-100/50 inline-block px-4 py-2 rounded-lg italic">💡 ข้อคิด: {victories[step-1].lesson}</p>
                                    </div>
                                    <div className="flex items-center justify-between pt-6 border-t border-slate-100">
                                        <div className="flex gap-2">
                                            {[1,2,3,4,5,6,7,8].map(i => (
                                                <div key={i} className={`h-2 rounded-full transition-all ${i === step ? 'w-8 bg-amber-500' : 'w-2 bg-slate-200'}`}></div>
                                            ))}
                                        </div>
                                        <button onClick={() => goTo(step + 1)} className="px-8 py-4 bg-amber-600 text-white rounded-2xl font-bold flex items-center gap-2 hover:bg-amber-700 transition-all">
                                            <span>{step === 8 ? "รับอานิสงส์" : "บทถัดไป"}</span>
                                            <Icon name="chevron-right" className="w-5 h-5" />
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                        {step === 9 && (
                            <div className="text-center bg-white p-12 md:p-20 rounded-[4rem] shadow-2xl border-t-8 border-amber-500 space-y-8">
                                <Icon name="sparkles" className="w-20 h-20 text-amber-500 mx-auto" />
                                <h2 className="text-5xl font-bold font-serif">อานิสสังสคาถา</h2>
                                <p className="text-2xl text-amber-800 italic leading-relaxed font-serif">"ผู้ใดระลึกถึงชัยชนะ ๘ ประการนี้เป็นประจำ <br /> จะพ้นจากอุปสรรคและประสบความสุข"</p>
                                <button onClick={() => goTo(0)} className="px-10 py-4 bg-slate-100 text-slate-600 rounded-full font-bold hover:bg-slate-200 transition-all">กลับหน้าแรก</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
